      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  redis:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    restart: unless-stopped
