[project]
name = "ragin"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "chromadb>=0.4",
    "sentence-transformers>=2.0",
    "httpx>=0.24",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "prometheus-client>=0.20",
    "mem0ai>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "httpx>=0.24",
    "ruff>=0.1.0",
    "hypothesis>=6.100",
]
dev = [
    "bandit>=1.7",
    "pip-audit>=2.6",
    "mypy>=1.5",
    "pre-commit>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["ragin"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"ragin/benchmark/*" = ["E501"]
"ragin/chrollo/*" = ["E501", "N806"]
"ragin/cycle/*" = ["E501", "N806"]
"ragin/cycle/harness.py" = ["F401"]
"ragin/don/*" = ["E501", "N815"]
"ragin/hisoka/*" = ["E501"]
"ragin/rollout/*" = ["E501"]
"ragin/server.py" = ["N806"]
"ragin/siem/syslog.py" = ["E402"]
"ragin/**/__init__.py" = ["F401"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PT"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.10"

[tool.mypy.ragin.gateway]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.mypy.ragin.hisoka]
check_untyped_defs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
