# RAGIN Cloud LLM Migration Configuration

# OpenRouter Configuration
OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
OPENROUTER_BASE_URL: "https://api.tokenrouter.com/v1"
OPENROUTER_APP_NAME: "RAGIN-Cyber-Deception"
OPENROUTER_APP_URL: "https://github.com/elaref/RAGIN"

# Model Router Configuration
MODEL_ROUTER:
  # Default models by capability
  default_models:
    reasoning: "moonshotai/kimi-k3-free"
    coding: "moonshotai/kimi-k3-free"
    fast: "moonshotai/kimi-k3-free"
    cheap: "moonshotai/kimi-k3-free"
    local_fallback: "local/qwen2.5-32b"

  # Routing rules by task type
  routing_rules:
    chrollo_inference:
      model: "moonshotai/kimi-k3-free"
      max_latency_ms: 500
      fallback: "moonshotai/kimi-k3-free"

    don_retrieval:
      model: "moonshotai/kimi-k3-free"
      max_latency_ms: 500
      fallback: "moonshotai/kimi-k3-free"

    hisoka_deception:
      model: "moonshotai/kimi-k3-free"
      max_latency_ms: 1000
      fallback_chain:
        - "moonshotai/kimi-k3-free"

    hisoka_skill_profiling:
      model: "moonshotai/kimi-k3-free"
      max_latency_ms: 500
      fallback: "moonshotai/kimi-k3-free"

  # Cost optimization
  cost_optimization:
    max_cost_per_request_usd: 0.10
    prefer_cheaper_when_latency_acceptable: true
    latency_threshold_for_cheaper_ms: 500

  # Fallback chain configuration
  fallback:
    max_retries: 3
    retry_delay_ms: 100
    circuit_breaker_threshold: 5
    circuit_breaker_timeout_s: 60

# Prompt Engineering Configuration
PROMPT_ENGINEERING:
  template_dir: "ragin/prompt/templates"
  few_shot_dir: "ragin/prompt/few_shots"
  max_few_shot_examples: 5
  variable_validation: strict

  # Hisoka skill-stratified templates
  hisoka_templates:
    novice:
      system_prompt: "templates/hisoka_novice_system.j2"
      few_shot: "few_shots/hisoka_novice_examples.json"
    intermediate:
      system_prompt: "templates/hisoka_intermediate_system.j2"
      few_shot: "few_shots/hisoka_intermediate_examples.json"
    expert:
      system_prompt: "templates/hisoka_expert_system.j2"
      few_shot: "few_shots/hisoka_expert_examples.json"
    apt:
      system_prompt: "templates/hisoka_apt_system.j2"
      few_shot: "few_shots/hisoka_apt_examples.json"

  # Don RAG templates
  don_templates:
    retrieval: "templates/don_retrieval.j2"
    rerank: "templates/don_rerank.j2"
    generate: "templates/don_generate.j2"
    cite: "templates/don_cite.j2"

  # Chrollo templates
  chrollo_templates:
    classify: "templates/chrollo_classify.j2"
    explain: "templates/chrollo_explain.j2"

# Response Validation Configuration
RESPONSE_VALIDATION:
  enabled: true
  strict_mode: true

  # Schema validation
  schemas:
    hisoka_response:
      type: "object"
      required: ["response", "skill_assessment", "deception_quality", "citations"]
      properties:
        response:
          type: "string"
          min_length: 10
          max_length: 4000
        skill_assessment:
          type: "string"
          enum: ["novice", "intermediate", "expert", "apt"]
        deception_quality:
          type: "number"
          minimum: 0.0
          maximum: 1.0
        citations:
          type: "array"
          items:
            type: "object"
            required: ["source", "text", "relevance"]
            properties:
              source: {type: "string"}
              text: {type: "string"}
              relevance: {type: "number", minimum: 0.0, maximum: 1.0}

    don_response:
      type: "object"
      required: ["answer", "citations", "confidence"]
      properties:
        answer:
          type: "string"
          min_length: 20
        citations:
          type: "array"
          min_items: 1
          items:
            type: "object"
            required: ["doc_id", "excerpt", "score"]
            properties:
              doc_id: {type: "string"}
              excerpt: {type: "string"}
              score: {type: "number", minimum: 0.0, maximum: 1.0}
        confidence:
          type: "number"
          minimum: 0.0
          maximum: 1.0

    chrollo_response:
      type: "object"
      required: ["classification", "confidence", "features_used", "explanation"]
      properties:
        classification:
          type: "string"
          enum: ["benign", "suspicious", "malicious"]
        confidence:
          type: "number"
          minimum: 0.0
          maximum: 1.0
        features_used:
          type: "array"
          items: {type: "string"}
        explanation:
          type: "string"

  # Hallucination detection
  hallucination_detection:
    enabled: true
    method: "self_consistency"
    samples: 3
    consistency_threshold: 0.8
    fact_check_sources: ["mitre", "exploit-db", "cve"]

  # Safety filters
  safety_filters:
    enabled: true
    block_categories:
      - "violence"
      - "illegal_activities"
      - "malware_creation"
      - "exploit_generation"
      - "credential_theft"
    custom_patterns: []

# Cost Tracking Configuration
COST_TRACKING:
  enabled: true
  budget:
    daily_usd: 100.0
    monthly_usd: 2000.0
    per_request_usd: 0.10
    per_component:
      chrollo: 10.0
      don: 50.0
      hisoka: 40.0

  # Pricing (per 1M tokens)
  pricing_usd_per_million:
    "moonshotai/kimi-k3-free": {input: 0.00, output: 0.00}
    "qwen/qwen-32b": {input: 0.50, output: 1.00}
    "qwen/qwen-2.5-72b-instruct": {input: 0.80, output: 1.60}
    "meta-llama/llama-3.1-8b-instruct": {input: 0.10, output: 0.10}
    "meta-llama/llama-3.1-70b-instruct": {input: 0.60, output: 0.80}
    "deepseek/deepseek-coder-v2": {input: 0.30, output: 0.60}
    "google/gemma-2-9b-it": {input: 0.10, output: 0.10}
    "anthropic/claude-3.5-haiku": {input: 0.25, output: 1.25}
    "local/qwen2.5-32b": {input: 0.00, output: 0.00}

  # Tracking storage
  storage:
    backend: "sqlite"
    path: "data/costs.db"
    retention_days: 90

  # Alerting
  alerts:
    daily_threshold_pct: 80
    monthly_threshold_pct: 75
    per_request_threshold_pct: 90
    webhook_url: "${COST_ALERT_WEBHOOK}"

# Observability Configuration
OBSERVABILITY:
  enabled: true
  service_name: "ragin-llm-gateway"

  # Metrics
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
    prefix: "ragin_gateway"

  # Tracing
  tracing:
    enabled: true
    endpoint: "http://jaeger:4318/v1/traces"
    sample_rate: 0.1

  # Logging
  logging:
    level: "INFO"
    format: "json"
    output: "stdout"

# Security Configuration
SECURITY:
  # API Key management
  api_keys:
    rotation_days: 30
    encryption: "aes-256-gcm"

  # Request validation
  request_validation:
    max_prompt_tokens: 32000
    max_response_tokens: 8000
    timeout_seconds: 30

  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    tokens_per_minute: 100000
    burst_allowance: 10

# Local Fallback Configuration
LOCAL_FALLBACK:
  enabled: true
  endpoint: "http://localhost:8000/v1"
  models:
    - "qwen2.5-32b"
    - "llama-3.1-8b"
  health_check_interval_s: 30
  max_concurrent: 4