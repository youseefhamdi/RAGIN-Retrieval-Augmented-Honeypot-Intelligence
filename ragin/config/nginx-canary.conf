worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format canary '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream=$upstream_addr '
                      'upstream_status=$upstream_status '
                      'upstream_resp_time=$upstream_response_time '
                      'canary_group=$cookie_ragin_canary';

    access_log /var/log/nginx/access.log canary;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=10r/m;

    # ── Canary weighted upstream ──────────────────────────────────────────────
    # 90% stable, 10% canary by default. Cookie-based sticky sessions ensure
    # a user who lands on canary stays on canary for the duration of the cookie.

    map $cookie_ragin_canary $canary_backend {
        default          hisoka-stable;
        "canary"         hisoka-canary;
        "stable"         hisoka-stable;
    }

    map $http_x_ragin_channel $channel_backend {
        default          "";
        "canary"         hisoka-canary;
        "stable"         hisoka-stable;
    }

    # Force canary for whitelisted IPs (comma-separated in canary_ips.conf)
    geo $ip_canary {
        default         0;
        include         /etc/nginx/canary_ips.conf;
    }

    upstream hisoka_balanced {
        least_conn;
        server hisoka-stable:8083 weight=90;
        server hisoka-canary:8084 weight=10;

        # Auto-remove unhealthy backends after 3 failures in 30s
        server hisoka-stable:8083 max_fails=3 fail_timeout=30s;
        server hisoka-canary:8084 max_fails=3 fail_timeout=30s;

        # Keep upstream connections alive
        keepalive 32;
    }

    upstream hisoka_stable {
        server hisoka-stable:8083;
        keepalive 16;
    }

    upstream hisoka_canary {
        server hisoka-canary:8084;
        keepalive 16;
    }

    # ── Stable upstreams for non-hisoka services ──────────────────────────────
    upstream gateway {
        server gateway:8080;
    }
    upstream chrollo {
        server chrollo:8081;
    }
    upstream don {
        server don:8082;
    }

    # ── Determine which upstream to use ───────────────────────────────────────
    # Priority: 1) header override, 2) IP whitelist, 3) cookie sticky, 4) weighted

    map $channel_backend $hisoka_upstream {
        ""              $canary_backend;   # no header → fall through to cookie/weight
        default         $channel_backend;  # header present → use it
    }

    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Gateway — LLM API proxy
        location /v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Chrollo — classifier service
        location /api/classify {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://chrollo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Don — RAG engine service
        location /api/analyze {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://don;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Hisoka — canary-aware deception service ───────────────────────────
        location /api/deceive {
            limit_req zone=api burst=10 nodelay;

            # 1. Header override (for internal testing)
            if ($channel_backend != "") {
                set $hisoka_upstream $channel_backend;
            }

            # 2. IP whitelist override
            if ($ip_canary = 1) {
                set $hisoka_upstream hisoka_canary;
            }

            # 3. Cookie-based sticky sessions (handled by map above)
            proxy_pass http://$hisoka_upstream;

            # Set sticky cookie if not already set
            add_header Set-Cookie "ragin_canary=canary; Path=/; Max-Age=86400; HttpOnly" always;
            add_cookie_field ragin_canary $canary_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-RAGIN-Backend $upstream_addr;
            proxy_read_timeout 120s;
        }

        # ── Health endpoints ──────────────────────────────────────────────────
        location = /gateway/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://gateway/health;
            proxy_set_header Host $host;
        }

        location = /chrollo/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://chrollo/health;
            proxy_set_header Host $host;
        }

        location = /don/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://don/health;
            proxy_set_header Host $host;
        }

        location = /hisoka/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://hisoka_balanced/health;
            proxy_set_header Host $host;
        }

        location = /hisoka-stable/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://hisoka_stable/health;
            proxy_set_header Host $host;
        }

        location = /hisoka-canary/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://hisoka_canary/health;
            proxy_set_header Host $host;
        }

        # Rollout status endpoint
        location = /rollout/status {
            default_type application/json;
            return 200 '{"canary_enabled":true,"stable_upstream":"hisoka-stable:8083","canary_upstream":"hisoka-canary:8084"}';
        }

        location / {
            return 404;
        }
    }
}
