worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    map_hash_bucket_size 128;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting — separate zones so scanner traffic on port 2222
    # cannot exhaust the budget for legitimate API traffic.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=lure:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=10r/m;

    # Upstream definitions
    upstream gateway {
        server gateway:8080;
    }
    upstream chrollo {
        server chrollo:8080;
    }
    upstream don {
        server don:8080;
    }
    upstream hisoka {
        server hisoka:8080;
    }

    # Auth check helper — validates Bearer token against API key
    map $http_authorization $is_authorized {
        default      0;
        "Bearer ragin-498562d07e6fd68377e26a6887d8e3fb0795f23731f1f5f5a9e972e1dbcc65f8" 1;
    }

    server {
        listen 80;
        server_name _;

        location /v1/ {
            if ($is_authorized = 0) {
                add_header X-Auth-Debug "denied: $http_authorization" always;
                return 401;
            }
            add_header X-Auth-Debug "allowed" always;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /gateway/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://gateway/health;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Deception endpoints on port 80 — reachable without HTTPS
        location /api/deceive {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://hisoka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/lure {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://hisoka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gateway — LLM API proxy (requires Bearer auth)
        location /v1/ {
            if ($is_authorized = 0) {
                add_header X-Auth-Debug "denied: $http_authorization" always;
                return 401;
            }
            add_header X-Auth-Debug "allowed" always;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Chrollo — classifier service
        location /api/classify {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://chrollo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Don — RAG engine service
        location /api/analyze {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://don;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Hisoka — deception service
        location /api/deceive {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://hisoka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Gateway health
        location = /gateway/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://gateway/health;
            proxy_set_header Host $host;
        }

        # Chrollo health
        location = /chrollo/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://chrollo/health;
            proxy_set_header Host $host;
        }

        # Don health
        location = /don/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://don/health;
            proxy_set_header Host $host;
        }

        # Hisoka health
        location = /hisoka/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://hisoka/health;
            proxy_set_header Host $host;
        }

        # Lure paths — proxy to Hisoka deception engine
        location /api/lure {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://hisoka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/(admin|login|\.env|wp-admin|wp-login\.php|api/v\d/users|api/v\d/login|api/users|api/login|actuator|dashboard|manager|console|debug|config|phpmyadmin|server-status|robots\.txt|backup|shell|cmd|exec|test|swagger|api-docs|openapi\.json|graphql|version|info)($|/) {
            limit_req zone=api burst=10 nodelay;
            rewrite ^ /api/lure break;
            proxy_pass http://hisoka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Lure-Path $request_uri;
            proxy_read_timeout 30s;
        }

        # Block everything else
        location / {
            return 404;
        }
    }

    # Dedicated deception listener — all traffic proxied to Hisoka via /api/lure
    server {
        listen 2222;
        server_name _;

        add_header X-Honeypot "true" always;

        # Health endpoint: passthrough (no rewrite)
        location = /health {
            proxy_pass http://hisoka/health;
            proxy_set_header Host $host;
        }

        # Everything else → Hisoka lure (returns deceptive HTML)
        # Uses dedicated rate limit zone so scanner traffic cannot
        # starve the main API rate budget.
        location / {
            limit_req zone=lure burst=10 nodelay;
            rewrite ^ /api/lure break;
            proxy_pass http://hisoka;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Lure-Path $request_uri;
            proxy_set_header X-Deception-Port "2222";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
