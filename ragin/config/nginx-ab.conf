worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format ab '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" upstream=$upstream_addr '
                  'upstream_status=$upstream_status '
                  'experiment=$cookie_ragin_experiment '
                  'experiment_header=$http_x_experiment';

    access_log /var/log/nginx/access.log ab;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=lure:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=10r/m;

    # ── A/B experiment routing ────────────────────────────────────────────────
    # 1. Header: X-Experiment: control | treatment
    # 2. Cookie: _ragin_experiment=control | treatment
    # 3. Default: random 50/50 via split_clients

    # Deterministic 50/50 split by request fingerprint (IP + URI)
    split_clients "${remote_addr}${request_uri}" $ab_default {
        50%     control;
        *       treatment;
    }

    # Cookie-based assignment
    map $cookie_ragin_experiment $cookie_group {
        default         $ab_default;
        "control"       control;
        "treatment"     treatment;
    }

    # Header override (for internal testing)
    map $http_x_experiment $header_group {
        default         $cookie_group;
        "control"       control;
        "treatment"     treatment;
    }

    map $header_group $hisoka_upstream {
        control         hisoka-control;
        treatment       hisoka-treatment;
        default         hisoka-control;
    }

    upstream hisoka-control {
        server hisoka-control:8083;
        keepalive 16;
    }

    upstream hisoka-treatment {
        server hisoka-treatment:8084;
        keepalive 16;
    }

    upstream gateway {
        server gateway:8080;
    }
    upstream chrollo {
        server chrollo:8081;
    }
    upstream don {
        server don:8082;
    }

    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Gateway
        location /v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Chrollo
        location /api/classify {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://chrollo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Don
        location /api/analyze {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://don;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Hisoka — A/B experiment routing ───────────────────────────────────
        location /api/deceive {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://hisoka_upstream;

            # Set experiment cookie for sticky sessions
            add_header Set-Cookie "_ragin_experiment=$header_group; Path=/; Max-Age=86400; HttpOnly" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-RAGIN-Experiment $header_group;
            proxy_set_header X-RAGIN-Backend $upstream_addr;
            proxy_read_timeout 120s;
        }

        # ── Lure endpoint (unauthenticated honeypot) ──────────────────────────
        location /api/lure {
            limit_req zone=lure burst=10 nodelay;
            proxy_pass http://$hisoka_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ~ ^/(admin|login|\.env|wp-admin|wp-login\.php|api/v\d/users|api/v\d/login|api/users|api/login|actuator|dashboard|manager|console|debug|config|phpmyadmin|server-status|robots\.txt|backup|shell|cmd|exec|test|swagger|api-docs|openapi\.json|graphql|version|info)($|/) {
            limit_req zone=lure burst=10 nodelay;
            rewrite ^ /api/lure break;
            proxy_pass http://$hisoka_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Lure-Path $request_uri;
            proxy_read_timeout 30s;
        }

        # ── Health endpoints ──────────────────────────────────────────────────
        location = /gateway/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://gateway/health;
            proxy_set_header Host $host;
        }

        location = /chrollo/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://chrollo/health;
            proxy_set_header Host $host;
        }

        location = /don/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://don/health;
            proxy_set_header Host $host;
        }

        location = /hisoka/health {
            limit_req zone=health burst=3 nodelay;
            proxy_pass http://hisoka-control/health;
            proxy_set_header Host $host;
        }

        location = /experiment/status {
            default_type application/json;
            return 200 '{"experiment_enabled":true,"groups":["control","treatment"],"split":"50/50"}';
        }

        location / {
            return 404;
        }
    }

    # Dedicated deception listener — isolated rate budget from main API traffic
    server {
        listen 2222;
        server_name _;

        add_header X-Honeypot "true" always;

        location = /health {
            proxy_pass http://hisoka-control/health;
            proxy_set_header Host $host;
        }

        location / {
            limit_req zone=lure burst=10 nodelay;
            rewrite ^ /api/lure break;
            proxy_pass http://$hisoka_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Lure-Path $request_uri;
            proxy_set_header X-Deception-Port "2222";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
