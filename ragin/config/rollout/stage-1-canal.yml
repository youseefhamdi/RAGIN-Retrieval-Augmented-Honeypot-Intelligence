stage: canal
description: "Canary — 5% traffic to canary, monitor for 48 hours."
traffic_split:
  stable_percent: 95
  canary_percent: 5
  shadow_percent: 0
monitoring:
  max_error_rate_delta: 0.005
  max_latency_p99_delta_ms: 100
  min_sample_size: 5000
  duration_hours: 48
  metrics_comparison: true
  response_discarded: false
rollback_triggers:
  - metric: error_rate
    condition: delta_gt
    threshold: 0.01
  - metric: latency_p99_ms
    condition: delta_gt
    threshold: 150
  - metric: cost_usd
    condition: delta_gt
    threshold: 0.05
go_no_go:
  - criterion: error_rate_delta_below_threshold
    required: true
  - criterion: latency_p99_delta_below_threshold
    required: true
  - criterion: cost_delta_below_threshold
    required: true
  - criterion: min_sample_size_reached
    required: true
next_stage: half
