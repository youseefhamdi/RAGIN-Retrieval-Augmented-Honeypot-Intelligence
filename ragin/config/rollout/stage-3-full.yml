stage: full
description: "100% canary — stable kept for 72h rollback window."
traffic_split:
  stable_percent: 0
  canary_percent: 100
  shadow_percent: 0
monitoring:
  max_error_rate: 0.01
  max_latency_p99_ms: 500
  min_sample_size: 20000
  duration_hours: 72
  rollback_window_hours: 168
  metrics_comparison: true
  response_discarded: false
rollback_triggers:
  - metric: error_rate
    condition: gt
    threshold: 0.015
  - metric: latency_p99_ms
    condition: gt
    threshold: 600
  - metric: cost_usd
    condition: gt
    threshold: 0.10
go_no_go:
  - criterion: error_rate_below_threshold
    required: true
  - criterion: latency_p99_below_threshold
    required: true
  - criterion: cost_within_budget
    required: true
  - criterion: min_sample_size_reached
    required: true
  - criterion: rollback_window_elapsed
    required: true
next_stage: cleanup
