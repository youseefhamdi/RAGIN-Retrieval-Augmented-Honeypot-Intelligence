services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - TOKENROUTER_API_KEY=${TOKENROUTER_API_KEY}
      - RUST_LOG=info
    volumes:
      - ./llm-gateway/config.toml:/app/config.toml:ro
    networks:
      - ragin-internal
      - ragin-external
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  chrollo:
    image: ragin-python:latest
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python3", "-m", "ragin.server", "--component", "chrollo"]
    ports:
      - "${CHROLLO_PORT:-8081}:8080"
    environment:
      - COMPONENT=chrollo
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY}
      - RAGIN_LOG_LEVEL=INFO
    networks:
      - ragin-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  don:
    image: ragin-python:latest
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python3", "-m", "ragin.server", "--component", "don"]
    ports:
      - "${DON_PORT:-8082}:8080"
    environment:
      - COMPONENT=don
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY}
      - RAGIN_LOG_LEVEL=INFO
    networks:
      - ragin-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  hisoka:
    image: ragin-python:latest
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python3", "-m", "ragin.server", "--component", "hisoka"]
    ports:
      - "${HISOKA_PORT:-8083}:8080"
    volumes:
      - ./ragin:/app/ragin:ro
    environment:
      - COMPONENT=hisoka
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY}
      - GATEWAY_URL=http://gateway:8080
      - RAGIN_LOG_LEVEL=INFO
    networks:
      - ragin-internal
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - ragin-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ragin/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ragin/config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ragin-internal
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./ragin/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ragin/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ragin-internal
      - ragin-external
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
      - "${HISOKA_DECEPTION_PORT:-2222}:2222"
    volumes:
      - ./ragin/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    networks:
      - ragin-external
      - ragin-internal
    depends_on:
      - gateway
      - chrollo
      - don
      - hisoka
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3

  cowrie:
    image: cowrie/cowrie:latest
    ports:
      - "${COWRIE_PORT:-2223}:2222"
    volumes:
      - cowrie-data:/cowrie/var/log/cowrie
    networks:
      - ragin-internal
      - ragin-external
    restart: unless-stopped

networks:
  ragin-internal:
    driver: bridge
    internal: true
  ragin-external:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  cowrie-data:
